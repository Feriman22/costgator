<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1544px; height: 500px; font-family: Inter, sans-serif; }
  .b { position: relative; width: 1544px; height: 500px; overflow: hidden;
       background: radial-gradient(circle at 85% 20%, #134e4a 0, transparent 55%), linear-gradient(135deg, #0b1324, #0f1f2e); color: #fff; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px); background-size: 44px 44px; }
  .left { position: absolute; left: 80px; top: 50%; transform: translateY(-50%); width: 800px; }
  .logo { display: flex; align-items: center; gap: 30px; }
  .logo img { width: 128px; height: 128px; }
  h1 { white-space: nowrap; font-size: 66px; font-weight: 800; letter-spacing: -1.5px; margin: 0; line-height: 1; }
  .for sup { font-size: 16px; margin-left: 2px; } .for { font-size: 30px; font-weight: 500; color: #5eead4; margin-top: 12px; }
  p { font-size: 34px; font-weight: 500; color: #cbd5e1; margin: 44px 0 0; line-height: 1.35; }
  .cards { position: absolute; right: 80px; top: 50%; transform: translateY(-50%); width: 500px; display: grid; gap: 18px; }
  .card { background: rgba(255,255,255,.96); color: #1e293b; border-radius: 16px; padding: 14px 26px; display: flex; justify-content: space-between; align-items: center; border-left: 10px solid; box-shadow: 0 18px 40px rgba(0,0,0,.35); }
  .card span { font-size: 30px; font-weight: 600; }
  .card b { font-size: 40px; font-weight: 800; }
  .red { border-color: #dc2626; } .red b { color: #dc2626; }
  .amber { border-color: #f59e0b; } .amber b { color: #b45309; }
  .teal { border-color: #14b8a6; } .teal b { color: #0f766e; }
</style></head>
<body><div class="b" id="banner">
  <div class="grid"></div>
  <div class="left">
    <div class="logo"><img src="icon.svg" alt=""><div><h1>CostGator</h1><div class="for">Margin Audit for WooCommerce<sup>&reg;</sup></div></div></div>
    <p>Find products, sales and coupons that could make you sell below cost.</p>
  </div>
  <div class="cards">
    <div class="card red"><span>Selling below cost</span><b>3</b></div>
    <div class="card amber"><span>Scheduled sales at risk</span><b>2</b></div>
    <div class="card amber"><span>Risky coupons</span><b>3</b></div>
    <div class="card teal"><span>Test a 25% discount</span><b>&#10003;</b></div>
  </div>
</div></body></html>
